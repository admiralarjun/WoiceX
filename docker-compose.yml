version: "3.9"

services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: woicex
      POSTGRES_PASSWORD: woicex
      POSTGRES_DB: woicexdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
